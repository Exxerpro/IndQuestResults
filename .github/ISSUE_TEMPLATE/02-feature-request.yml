name: 💡 Feature Request
description: Propose a new feature with complete technical design
title: "[FEATURE]: "
labels: ["enhancement", "needs-evaluation"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ READ BEFORE SUBMITTING ⚠️
        
        **This request will be IMMEDIATELY CLOSED if:**
        - No clear business justification is provided
        - Technical design is incomplete or missing
        - Performance impact is not analyzed
        - Compatibility considerations are ignored
        
        **Feature requests require extensive analysis and justification.**

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites ✅
      description: Confirm you have completed these steps
      options:
        - label: I have searched existing issues and discussions
          required: true
        - label: I have reviewed the current API and architecture
          required: true
        - label: I understand this requires significant justification
          required: true
        - label: I am prepared to contribute to implementation if accepted
          required: true

  - type: textarea
    id: business-justification
    attributes:
      label: "* Business Justification"
      description: "Why is this feature needed? What business value does it provide?"
      placeholder: |
        - Business problem this solves
        - Target audience and use cases
        - Competitive advantage or necessity
        - ROI or impact metrics
    validations:
      required: true

  - type: textarea
    id: use-cases
    attributes:
      label: "* Detailed Use Cases"
      description: "Specific scenarios where this feature would be used"
      placeholder: |
        1. **Use Case 1**: Enterprise validation scenarios
           - Context: Large-scale data processing...
           - Current limitation: ...
           - Proposed solution: ...
        
        2. **Use Case 2**: High-performance APIs
           - Context: ...
           - Current limitation: ...
           - Proposed solution: ...
    validations:
      required: true

  - type: textarea
    id: proposed-api
    attributes:
      label: "* Proposed API Design"
      description: "Complete API specification with examples"
      placeholder: |
        ```csharp
        // Proposed API
        public static class ResultEnhancements
        {
            public static Result<T> NewFeature<T>(this Result<T> result, parameters...)
            {
                // Implementation concept
            }
        }
        
        // Usage examples
        var result = GetUser()
            .NewFeature(parameters)
            .Map(user => user.ToDto());
        ```
    validations:
      required: true

  - type: textarea
    id: performance-analysis
    attributes:
      label: "* Performance Impact Analysis"
      description: "How will this affect performance? Include memory and CPU considerations."
      placeholder: |
        **Memory Impact:**
        - Additional allocations: ...
        - Memory optimization strategies: ...
        
        **CPU Impact:**
        - Computational complexity: O(...)
        - Performance benchmarks needed: ...
        
        **Scalability:**
        - Impact on high-throughput scenarios: ...
        - Thread safety considerations: ...
    validations:
      required: true

  - type: textarea
    id: compatibility-analysis
    attributes:
      label: "* Compatibility Analysis"
      description: "How does this affect existing code and architecture?"
      placeholder: |
        **Breaking Changes:**
        - None / List specific changes
        
        **API Compatibility:**
        - Backward compatibility: Maintained/Affected
        - Source compatibility: ...
        - Binary compatibility: ...
        
        **Architecture Impact:**
        - Affects core Result<T> patterns: Yes/No
        - Requires new extension namespaces: Yes/No
        - Zero-dependency policy: Maintained/Affected
    validations:
      required: true

  - type: textarea
    id: implementation-plan
    attributes:
      label: "* Implementation Approach"
      description: "How would you implement this feature?"
      placeholder: |
        **Technical Approach:**
        1. Core implementation in: ...
        2. Extension methods in: ...
        3. Performance optimizations: ...
        
        **Testing Strategy:**
        - Unit tests coverage: ...
        - Performance tests: ...
        - Mutation testing: ...
        
        **Documentation Plan:**
        - XML documentation: ...
        - Usage examples: ...
        - Architecture updates: ...
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "* Feature Priority"
      description: "How important is this feature?"
      options:
        - "Critical - Blocks major use cases"
        - "High - Significantly improves library"
        - "Medium - Nice to have enhancement"
        - "Low - Minor convenience"
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: "* Implementation Complexity"
      description: "How complex would this be to implement?"
      options:
        - "Low - Simple extension method"
        - "Medium - Moderate core changes"
        - "High - Significant architecture changes"
        - "Very High - Fundamental redesign required"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Solutions"
      description: "What other approaches could solve this problem?"
      placeholder: |
        1. **Alternative 1**: Current workaround
           - Pros: ...
           - Cons: ...
        
        2. **Alternative 2**: Different approach
           - Pros: ...
           - Cons: ...
        
        **Why the proposed solution is better:**
        ...

  - type: textarea
    id: migration-strategy
    attributes:
      label: "Migration Strategy"
      description: "If this involves breaking changes, how would users migrate?"
      placeholder: |
        **If breaking changes:**
        - Migration path: ...
        - Deprecation timeline: ...
        - Tooling support: ...
        
        **If non-breaking:**
        - Adoption strategy: ...
        - Documentation updates: ...

  - type: checkboxes
    id: contribution-commitment
    attributes:
      label: Contribution Commitment
      description: Are you willing to contribute to implementation?
      options:
        - label: I am willing to implement this feature
        - label: I am willing to write comprehensive tests
        - label: I am willing to write documentation
        - label: I am willing to create performance benchmarks

  - type: markdown
    attributes:
      value: |
        ---
        
        ## 📋 Evaluation Process
        
        **Feature requests will be evaluated based on:**
        
        1. **Business Value** - Clear need and benefit
        2. **Technical Merit** - Sound design and implementation
        3. **Performance Impact** - No regressions, optimizations considered
        4. **Architectural Fit** - Aligns with library principles
        5. **Maintenance Cost** - Long-term sustainability
        6. **Community Value** - Broad applicability
        
        **Timeline:**
        - Initial review: 1-2 weeks
        - Community feedback: 2-4 weeks
        - Implementation planning: 1-2 weeks
        
        **Acceptance Rate:** ~10-15% of feature requests are accepted due to our high quality standards.
        
        **Most Rejected Reasons:**
        - Insufficient business justification
        - Performance concerns
        - Architectural misalignment
        - Maintenance complexity