name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: './Src/Code/IndQuestResults.sln'
  COVERAGE_MIN_LINE: '85'
  COVERAGE_MIN_BRANCH: '75'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0 # For GitVersion
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
      
    - name: Run ROP Compliance Analyzers
      run: |
        echo "Running ROP compliance analyzers..."
        dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore /p:RunAnalyzers=true /p:RunCodeAnalysis=true 2>&1 | grep -E "(IQR201|IQR202|IQR301|IQR302)" || echo "No ROP violations detected"
      
    - name: Test with coverage (Cobertura)
      shell: bash
      run: |
        # The solution mixes test runners (xUnit v3 / Microsoft.Testing.Platform for the unit project,
        # VSTest for the mutation project), so collect coverage at the process level with dotnet-coverage.
        # It is runner-agnostic, unlike VSTest's --collect:"XPlat Code Coverage", which MTP ignores
        # (previously producing no coverage file and failing the report step).
        dotnet tool install --global dotnet-coverage
        export PATH="$PATH:$HOME/.dotnet/tools"
        # Explicit `--` separates dotnet-coverage's own options from the wrapped command, so the
        # inner `dotnet test ... -- --filter-not-class` is passed through verbatim.
        dotnet-coverage collect \
          --output coverage.cobertura.xml \
          --output-format cobertura \
          -- dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build -- --filter-not-class IndQuestResults.Tests.Unit.Performance.PerformanceMetricsSmokeTests

    - name: Generate coverage report (HTML + library-scoped Cobertura)
      shell: bash
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        export PATH="$PATH:$HOME/.dotnet/tools"
        # Scope to the shipping library only (exclude tests/samples/benchmarks/analyzers and the
        # Performance implementation) so enforced rates reflect the core API — matching the intent of
        # the previous coverlet runsettings. The scoped Cobertura report feeds the threshold gate below.
        reportgenerator \
          -reports:coverage.cobertura.xml \
          -targetdir:coverage-report \
          -reporttypes:"Html;HtmlSummary;Cobertura" \
          -assemblyfilters:"+IndQuestResults;-IndQuestResults.Tests*;-IndQuestResults.Samples*;-IndQuestResults.Benchmarks*;-IndQuestResults.Analyzers*" \
          -filefilters:"-*Performance*"

    - name: Enforce coverage threshold
      run: |
        python3 - << 'PY'
        import os, glob, xml.etree.ElementTree as ET
        # Prefer the library-scoped Cobertura produced by reportgenerator; fall back to the raw file.
        files = glob.glob('coverage-report/Cobertura.xml') or glob.glob('**/coverage.cobertura.xml', recursive=True)
        if not files:
            raise SystemExit('No coverage report found')
        latest = max(files, key=os.path.getmtime)
        root = ET.parse(latest).getroot()
        lr = float(root.get('line-rate')) * 100.0
        br = float(root.get('branch-rate')) * 100.0
        print(f'Coverage: line={lr:.2f}% branch={br:.2f}% ({latest})')
        min_line = float(os.environ.get('COVERAGE_MIN_LINE','85'))
        min_branch = float(os.environ.get('COVERAGE_MIN_BRANCH','75'))
        if lr < min_line or br < min_branch:
            raise SystemExit(f'Coverage below threshold (line {min_line}%, branch {min_branch}%)')
        PY
      
    - name: Upload coverage reports (artifacts)
      uses: actions/upload-artifact@v5
      with:
        name: coverage-cobertura
        path: |
          **/coverage.cobertura.xml
          coverage-report/**

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: |
          **/coverage.cobertura.xml
        fail_ci_if_error: false
        
  link-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
    - name: Check links
      uses: lycheeverse/lychee-action@v2
      with:
        # docs/archive/** holds frozen historical drafts (e.g. README.backup.md) whose relative
        # links were valid in their original location; they are intentionally not maintained, so
        # exclude them from link validation rather than rewriting archived content.
        args: --verbose --no-progress --exclude-path "coverage-report/**" --exclude-path "docs/archive/**" -- "**/*.md" "docs/**/*.md"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

