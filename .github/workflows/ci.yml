name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: './Src/Code/IndQuestResults.sln'
  COVERAGE_MIN_LINE: '85'
  COVERAGE_MIN_BRANCH: '75'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0 # For GitVersion
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
      
    - name: Run ROP Compliance Analyzers
      run: |
        echo "Running ROP compliance analyzers..."
        dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore /p:RunAnalyzers=true /p:RunCodeAnalysis=true 2>&1 | grep -E "(IQR201|IQR202|IQR301|IQR302)" || echo "No ROP violations detected"
      
    - name: Test with coverage (Cobertura)
      run: |
        dotnet test ${{ env.SOLUTION_PATH }} \
          --configuration Release \
          --no-build \
          --settings coverage.runsettings \
          --collect:"XPlat Code Coverage" \
          -- \
          --filter-not-class IndQuestResults.Tests.Unit.Performance.PerformanceMetricsSmokeTests

    - name: Generate HTML coverage report
      shell: bash
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool
        echo "${HOME}/.dotnet/tools" >> $GITHUB_PATH
        reportgenerator \
          -reports:**/coverage.cobertura.xml \
          -targetdir:coverage-report \
          -reporttypes:Html;HtmlSummary

    - name: Enforce coverage threshold
      run: |
        python3 - << 'PY'
        import os, glob, xml.etree.ElementTree as ET
        files = glob.glob('**/coverage.cobertura.xml', recursive=True)
        if not files:
            raise SystemExit('No coverage.cobertura.xml found')
        latest = max(files, key=os.path.getmtime)
        root = ET.parse(latest).getroot()
        lr = float(root.get('line-rate')) * 100.0
        br = float(root.get('branch-rate')) * 100.0
        print(f'Coverage: line={lr:.2f}% branch={br:.2f}% ({latest})')
        min_line = float(os.environ.get('COVERAGE_MIN_LINE','85'))
        min_branch = float(os.environ.get('COVERAGE_MIN_BRANCH','75'))
        if lr < min_line or br < min_branch:
            raise SystemExit(f'Coverage below threshold (line {min_line}%, branch {min_branch}%)')
        PY
      
    - name: Upload coverage reports (artifacts)
      uses: actions/upload-artifact@v5
      with:
        name: coverage-cobertura
        path: |
          **/coverage.cobertura.xml
          coverage-report/**

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: |
          **/coverage.cobertura.xml
        fail_ci_if_error: false
        
  link-check:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
    - name: Check links
      uses: lycheeverse/lychee-action@v2
      with:
        args: --verbose --no-progress --exclude-path "coverage-report/**" -- "**/*.md" "docs/**/*.md"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

