name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC token for NuGet.org Trusted Publishing

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'Src/Code/IndQuestResults.sln'

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

    - name: Test
      run: |
        dotnet test ${{ env.SOLUTION_PATH }} \
          --configuration Release \
          --no-build \
          -- \
          --filter-not-class IndQuestResults.Tests.Unit.Performance.PerformanceMetricsSmokeTests

    - name: Pack
      run: dotnet pack Src/Code/src/IndQuestResults/IndQuestResults.csproj -c Release --no-build -o ./packages

    # Trusted Publishing: exchanges this workflow's OIDC identity for a
    # short-lived NuGet.org API key. Requires a Trusted Publishing policy on
    # nuget.org pointing at this repo + workflow file, and the repository
    # variable NUGET_USER set to the nuget.org profile that owns the package.
    - name: NuGet login (Trusted Publishing)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ./packages/*.nupkg \
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: packages/*.nupkg
