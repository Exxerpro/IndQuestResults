name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'Src/Code/src/IndQuestResults/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Install DocFX
      run: |
        dotnet tool update -g docfx
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Generate metadata
      run: docfx docs/docfx/docfx.json metadata

    - name: Build site
      run: docfx docs/docfx/docfx.json build

    - name: Generate sitemap
      run: |
        echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?>" > docs/docfx/_site/sitemap.xml
        echo "<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">" >> docs/docfx/_site/sitemap.xml
        echo "  <url><loc>${{ github.server_url }}/${{ github.repository }}/</loc></url>" >> docs/docfx/_site/sitemap.xml
        echo "</urlset>" >> docs/docfx/_site/sitemap.xml

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/docfx/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
